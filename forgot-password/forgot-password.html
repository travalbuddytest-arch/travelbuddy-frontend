<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Travel Buddy — Forgot Password</title>
<meta name="description" content="Reset your Travel Buddy account password securely via email or SMS OTP.">
<link rel="icon" type="image/jpeg" href="../images/logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="forgot-password.css" />
  <link rel="stylesheet" href="../shared/site-banner.css?v=2">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <main class="stage">
    <section class="card" role="main" aria-labelledby="pageTitle">
      <a id="backBtn" href="../login/login.html" class="back-btn" aria-label="Back to login">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <header class="card-header" id="brandHeader">
        <div class="logo" aria-hidden="true">
          <img src="../images/logo.jpeg" alt="" width="60" height="60" />
        </div>
        <img src="../images/name.png" class="brand-mark" alt="Travel Buddy" />
        <h1 id="pageTitle" class="welcome">Forgot Password</h1>
        <p class="subtitle" id="pageSubtitle">Choose where you want to receive your OTP.</p>
      </header>

      <form id="requestForm" class="form" novalidate>
        <div class="field">
          <label for="otpMethod">Send OTP to</label>
          <select id="otpMethod" class="select" required>
            <option value="email">Email</option>
            <option value="phone">Mobile number</option>
          </select>
        </div>

        <div class="field" id="emailField">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="name@example.com" autocomplete="email" />
          <span class="error-msg" id="emailError" role="alert"></span>
        </div>

        <div class="field-group hidden" id="phoneField">
          <div class="field field-code">
            <label for="countryCode">Code</label>
            <select id="countryCode" class="select">
              <option value="+1">+1</option>
              <option value="+44">+44</option>
              <option value="+91" selected>+91</option>
              <option value="+61">+61</option>
              <option value="+971">+971</option>
            </select>
          </div>
          <div class="field field-phone">
            <label for="phone">Mobile number</label>
            <input type="tel" id="phone" placeholder="98765 43210" autocomplete="tel" inputmode="tel" />
            <span class="error-msg" id="phoneError" role="alert"></span>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="sendOtpBtn">
          <span class="btn-label">Send OTP</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <p class="helper-line">If your account is not found, create an account first.</p>
      </form>

      <form id="otpForm" class="form hidden" novalidate>
        <div class="field">
          <label for="otpDigit1">Enter the 6-digit OTP</label>
          <div class="otp-row" id="otpRow">
            <input id="otpDigit1" type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="OTP digit 1" />
            <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="OTP digit 2" />
            <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="OTP digit 3" />
            <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="OTP digit 4" />
            <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="OTP digit 5" />
            <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="OTP digit 6" />
          </div>
          <span class="error-msg error-msg--center" id="otpError" role="alert"></span>
        </div>

        <button type="submit" class="btn-primary" id="verifyOtpBtn">
          <span class="btn-label">Verify OTP</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <p class="helper-line">Didn't get the code? <button type="button" class="link-button" id="resendBtn">Resend OTP</button></p>
      </form>

      <form id="resetForm" class="form hidden" novalidate>
        <div class="field">
          <label for="newPassword">New password</label>
          <div class="input-wrap">
            <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password" required />
            <button type="button" class="toggle-password" data-target="newPassword" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <span class="error-msg" id="newPasswordError" role="alert"></span>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <div class="input-wrap">
            <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password" required />
            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <span class="error-msg" id="confirmPasswordError" role="alert"></span>
        </div>

        <button type="submit" class="btn-primary" id="setPasswordBtn">
          <span class="btn-label">Set Password</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>
    </section>
  </main>

    <script src="../shared/config.js?v=1"></script>
    <script src="../shared/auth-cookie-client.js?v=1"></script>
    <script src="../shared/analytics-client.js?v=1"></script>
<script src="forgot-password.js"></script>
  <script src="../shared/site-banner.js?v=2"></script>
</body>
</html>
