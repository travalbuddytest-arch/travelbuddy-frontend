<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Forgot Password | TravelBuddy</title>
<meta name="description" content="Request a password reset link for your TravelBuddy account.">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/jpeg" href="../images/logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="forgot-password.css" />
<link rel="stylesheet" href="../shared/site-banner.css?v=3">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <main class="stage">
    <section class="card" role="main" aria-labelledby="pageTitle">
      <a id="backBtn" href="../login/login.html" class="back-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Back to login</span>
      </a>

      <header class="card-header" id="brandHeader">
        <div class="logo-wrap" aria-hidden="true">
          <img src="../images/logo-horizontal.png" alt="TravelBuddy" width="180" height="40" />
        </div>

        <div class="icon-circle">
            <i class="fa-solid fa-envelope-open-text"></i>
        </div>

        <h1 id="pageTitle" class="welcome">Forgot Password?</h1>
        <p class="subtitle" id="pageSubtitle">Enter your email address and we'll send you a link to reset your password.</p>
      </header>

      <form id="requestForm" class="form" novalidate>
        <div class="field" id="emailField">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="name@company.com" autocomplete="email" required />
          <span class="error-msg" id="emailError" role="alert"></span>
        </div>

        <button type="submit" class="btn-primary" id="sendBtn">
          <span class="btn-label">Send Reset Link</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>
    </section>
  </main>

  <script src="../shared/config.js?v=1"></script>
  <script src="forgot-password.js"></script>
  <script src="../shared/site-banner.js?v=3"></script>
</body>
</html>
