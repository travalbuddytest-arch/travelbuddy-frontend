<!DOCTYPE html>
<html lang="en">
<head>
<script src="../shared/auth-guard.js" data-guard="user"></script>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>TravelBuddy - Messages</title>
<link rel="icon" type="image/jpeg" href="../images/logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/common.css" />
<link rel="stylesheet" href="css/messages.css?v=2" />
  <link rel="stylesheet" href="../shared/site-banner.css?v=3">
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div class="app-shell">
    <div id="tbAppSidebarInclude"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main">
      <div id="tbAppTopbarInclude"></div>

      <main class="content" id="content">
        <section class="view active" id="view-messages">
          <div class="messages-shell" id="messagesShell">
            <aside class="thread-panel" id="threadPanel" aria-label="Conversations">
              <div class="thread-panel-head">
                <h2>Messages</h2>
                <div class="thread-search">
                  <i class="fa-solid fa-magnifying-glass"></i>
                  <input type="search" id="conversationSearch" placeholder="Search conversations" autocomplete="off" />
                </div>
              </div>
              <div class="thread-list" id="threadList"></div>
            </aside>

            <div class="chat-panel" id="chatPanel">
              <div class="chat-empty" id="chatEmpty">
                <i class="fa-solid fa-comments"></i>
                <p>Select a conversation to start chatting.</p>
              </div>

              <div class="chat-active hidden" id="chatActive">
                <div class="chat-header">
                  <button type="button" class="chat-back" id="chatBackBtn" aria-label="Back to conversations">
                    <i class="fa-solid fa-arrow-left"></i>
                  </button>
                  <button type="button" class="avatar avatar--sm chat-avatar-btn" id="chatAvatar" aria-label="View profile">VT</button>
                  <div class="chat-identity" id="chatIdentity" role="button" tabindex="0">
                    <h3 id="chatName">-</h3>
                    <span id="chatMeta">-</span>
                  </div>
                  <button type="button" class="icon-btn call-btn" id="audioCallBtn" aria-label="Start private audio call">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                  </button>
                  <div class="chat-menu-wrap" id="chatMenuWrap">
                    <button type="button" class="icon-btn" id="chatMenuBtn" aria-label="Chat options" aria-expanded="false">
                      <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <div class="chat-menu" id="chatMenu">
                      <button type="button" id="chatMenuViewProfile"><i class="fa-solid fa-user"></i><span>View profile</span></button>
                      <button type="button" id="chatMenuClear"><i class="fa-solid fa-broom"></i><span>Clear chat</span></button>
                      <button type="button" id="chatMenuDelete" class="danger"><i class="fa-solid fa-trash-can"></i><span>Delete chat</span></button>
                    </div>
                  </div>
                </div>
                <div class="parcel-bar" id="parcelBar"></div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="typing-indicator hidden" id="typingIndicator">Typing...</div>
                <div class="attach-preview hidden" id="attachPreview">
                  <img id="attachPreviewImg" alt="Selected photo" />
                  <span id="attachPreviewName"></span>
                  <button type="button" id="attachPreviewRemove" aria-label="Remove photo"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form class="chat-input-row" id="chatForm">
                  <button type="button" class="attach-btn" id="attachBtn" aria-label="Attach photo">
                    <i class="fa-solid fa-paperclip"></i>
                  </button>
                  <input type="file" id="chatPhotoInput" accept="image/jpeg,image/png,.jpg,.jpeg,.png" hidden />
                  <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off" />
                  <button type="submit" class="send-btn" aria-label="Send message">
                    <i class="fa-solid fa-paper-plane"></i>
                  </button>
                </form>
              </div>
            </div>
          </div>

          <div class="contact-profile-overlay hidden" id="contactProfileOverlay">
            <div class="contact-profile-card" role="dialog" aria-modal="true" aria-labelledby="contactProfileName">
              <button type="button" class="modal-close" id="contactProfileClose" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
              </button>
              <div class="avatar contact-profile-avatar" id="contactProfileAvatar">VT</div>
              <h3 id="contactProfileName">-</h3>
              <p id="contactProfileRole">-</p>
              <div class="contact-profile-stats">
                <div>
                  <strong id="contactProfileDelivered">0</strong>
                  <span>Delivered parcels</span>
                </div>
                <div>
                  <strong id="contactProfileRating">-</strong>
                  <span>Rating</span>
                </div>
              </div>
              <div class="contact-profile-info" id="contactProfileInfo"></div>
            </div>
          </div>

          <div class="confirm-overlay hidden" id="chatConfirmOverlay">
            <div class="confirm-card">
              <h3 id="chatConfirmTitle">Are you sure?</h3>
              <p id="chatConfirmText"></p>
              <div class="confirm-actions">
                <button type="button" class="btn-ghost" id="chatConfirmCancel">Cancel</button>
                <button type="button" class="btn-danger" id="chatConfirmOk">Confirm</button>
              </div>
            </div>
          </div>

          <div class="call-modal hidden" id="incomingCallModal" role="dialog" aria-modal="true">
            <div class="call-card">
              <div class="avatar call-avatar" id="incomingAvatar">VS</div>
              <h3 id="incomingRole">Verified Sender</h3>
              <p id="incomingPublicId">SD-0000</p>
              <p id="incomingRouteInfo" class="hidden"></p>
              <strong>Incoming Audio Call</strong>
              <div class="call-actions">
                <button type="button" class="btn-ghost call-reject" id="rejectCallBtn"><i class="fa-solid fa-phone-slash"></i> Reject</button>
                <button type="button" class="btn-primary btn-primary--inline" id="acceptCallBtn">
                  <span class="btn-label"><i class="fa-solid fa-mobile-screen-button"></i> Accept</span>
                </button>
              </div>
            </div>
          </div>

          <div class="active-call hidden" id="activeCallBar">
            <div>
              <strong id="activeCallPeer">Verified Traveler</strong>
              <span id="activeCallTime">00:00</span>
            </div>
            <button type="button" class="icon-btn" id="muteCallBtn" aria-label="Mute microphone">
              <i class="fa-solid fa-microphone"></i>
            </button>
            <button type="button" class="icon-btn end-call-btn" id="endCallBtn" aria-label="End call">
              <i class="fa-solid fa-phone-slash"></i>
            </button>
          </div>

          <audio id="remoteAudio" autoplay></audio>

          <!-- Image Preview Modal -->
          <div class="image-preview-modal hidden" id="imagePreviewModal" role="dialog" aria-modal="true" aria-label="Image preview">
            <div class="image-preview-container">
              <button class="image-preview-close" id="imagePreviewClose" aria-label="Close image preview">
                <i class="fa-solid fa-xmark"></i>
              </button>
              <img class="image-preview-img" id="imagePreviewImg" alt="Message image preview" />
            </div>
          </div>

        </section>
      </main>
    </div>
  </div>

    <script defer src="../shared/config.js?v=1"></script>
    <script defer src="../shared/auth-cookie-client.js?v=1"></script>
    <script defer src="../shared/analytics-client.js?v=1"></script>
    <script defer src="../shared/date-utils.js"></script>
<script defer src="https://travelbuddy-backend-19l6.onrender.com/socket.io/socket.io.js"></script>
  <script defer src="js/common.js?v=4"></script>
  <script defer src="js/messages.js?v=2"></script>
  <script defer src="../shared/site-banner.js?v=3"></script>
  <script defer src="../shared/firebase-config.js?v=1"></script>
  <script defer src="../shared/push-client.js?v=1"></script>
</body>
</html>
