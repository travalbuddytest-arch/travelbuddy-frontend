<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../shared/auth-guard.js" data-guard="user"></script>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TravelBuddy — Security</title>
  <link rel="icon" type="image/jpeg" href="../images/logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="../shared/site-banner.css?v=3">
  <style>
    .security-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 22px;
    }
    @media (max-width: 900px) {
      .security-grid { grid-template-columns: 1fr; }
    }
    .toggle-switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px;
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }
    .switch-label-text {
      flex: 1;
    }
    .switch-label-text strong {
      display: block;
      font-size: 14px;
      color: var(--text-main);
      margin-bottom: 2px;
    }
    .switch-label-text p {
      margin: 0;
      font-size: 12.5px;
      color: var(--text-muted);
    }
    /* Toggle Switch */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
      flex-shrink: 0;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #CBD5E1;
      transition: 0.2s;
      border-radius: 34px;
    }
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }
    input:checked + .toggle-slider {
      background-color: var(--primary);
    }
    input:checked + .toggle-slider:before {
      transform: translateX(22px);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div class="app-shell">
    <div id="tbAppSidebarInclude"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main">
      <div id="tbAppTopbarInclude"></div>

      <main class="content" id="content">
        <div class="security-grid">
          <!-- Left: Change Password Form -->
          <div class="tb-panel">
            <div class="tb-panel-head">
              <div class="tb-panel-title">
                <h3>Change Password</h3>
                <p>Ensure your account is using a strong password.</p>
              </div>
            </div>

            <form id="changePasswordForm" class="stack-form">
              <div class="field">
                <label for="currentPasswordInput">Current Password *</label>
                <input type="password" id="currentPasswordInput" class="tb-input" placeholder="Enter current password" required />
              </div>

              <div class="field">
                <label for="newPasswordInput">New Password *</label>
                <input type="password" id="newPasswordInput" class="tb-input" placeholder="Minimum 8 characters" minlength="8" required />
              </div>

              <div class="field">
                <label for="confirmPasswordInput">Confirm New Password *</label>
                <input type="password" id="confirmPasswordInput" class="tb-input" placeholder="Re-enter new password" minlength="8" required />
              </div>

              <button type="submit" class="btn-primary" id="savePasswordBtn" style="align-self:flex-start; margin-top:12px; padding: 0 32px;">
                <span class="btn-label"><i class="fa-solid fa-key"></i> Update Password</span>
                <span class="spinner"></span>
              </button>
            </form>
          </div>

          <!-- Right: Two-Step & Recovery Email -->
          <div style="display:flex; flex-direction:column; gap:24px;">
            <!-- Two-Step Verification -->
            <div class="tb-panel">
              <div class="tb-panel-head">
                <div class="tb-panel-title">
                  <h3>Two-Step Authentication</h3>
                </div>
              </div>

              <div class="toggle-switch-row" style="background: var(--tb-bg); border-radius: var(--radius-md); padding: 20px; border: 1px solid var(--tb-border);">
                <div class="switch-label-text">
                  <strong style="color: var(--tb-navy);">Email Verification</strong>
                  <p style="font-size: 12px; color: var(--tb-text-muted);">Require an email OTP whenever logging in.</p>
                </div>
                <label class="tb-toggle">
                  <input type="checkbox" id="toggle2faCheck" />
                  <span class="tb-toggle-slider"></span>
                </label>
              </div>
            </div>

            <!-- Recovery Email -->
            <div class="tb-panel">
              <div class="tb-panel-head">
                <div class="tb-panel-title">
                  <h3>Recovery Email</h3>
                  <p>Used if you lose access to your primary email.</p>
                </div>
              </div>

              <form id="recoveryEmailForm" class="stack-form">
                <div class="field">
                  <input type="email" id="recoveryEmailInput" class="tb-input" placeholder="backup@example.com" required />
                </div>
                <button type="submit" class="btn-primary" id="saveRecoveryBtn" style="width: 100%;">
                  <span class="btn-label">Save Recovery Email</span>
                  <span class="spinner"></span>
                </button>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script defer src="../shared/config.js?v=1"></script>
  <script defer src="../shared/auth-cookie-client.js?v=1"></script>
  <script defer src="../shared/analytics-client.js?v=1"></script>
  <script defer src="../shared/validation-helper.js?v=1"></script>
  <script defer src="../shared/date-utils.js"></script>
  <script defer src="https://travelbuddy-backend-19l6.onrender.com/socket.io/socket.io.js"></script>
  <script defer src="js/common.js?v=4"></script>
  <script defer src="js/security.js"></script>
  <script defer src="../shared/site-banner.js?v=3"></script>
</body>
</html>
