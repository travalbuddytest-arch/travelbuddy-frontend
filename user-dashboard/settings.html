<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../shared/auth-guard.js" data-guard="user"></script>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TravelBuddy — Settings</title>
  <link rel="icon" type="image/jpeg" href="../images/logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="../shared/site-banner.css?v=3">
  <style>
    .settings-container {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
  </style>
</head>
<body>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div class="app-shell">
    <div id="tbAppSidebarInclude"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main">
      <div id="tbAppTopbarInclude"></div>

      <main class="content" id="content">
        <div class="dashboard-container">
          <div class="settings-container">
            <!-- Security Shortcuts -->
            <div class="tb-panel">
              <div class="tb-panel-head">
                <div class="tb-panel-title">
                  <h3>Account Security</h3>
                </div>
              </div>
              <p style="font-size:13px; color:var(--tb-text-muted); margin-bottom:20px;">
                Manage your passwords, verification, and recovery options.
              </p>
              <div style="display:flex; gap:12px; flex-wrap:wrap;">
                <a href="security.html" class="btn-primary" style="text-decoration:none;">
                  <i class="fa-solid fa-shield-halved"></i> Security Settings
                </a>
                <a href="devices.html" class="btn-ghost" style="text-decoration:none;">
                  <i class="fa-solid fa-laptop-file"></i> Active Sessions
                </a>
              </div>
            </div>

            <!-- Privacy & Cookies -->
            <div class="tb-panel">
              <div class="tb-panel-head">
                <div class="tb-panel-title">
                  <h3>Privacy Preferences</h3>
                  <p>Manage your data and tracking settings.</p>
                </div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 12px;">
                <button type="button" class="btn-secondary btn-full" id="manageCookiesBtn">
                  <i class="fa-solid fa-cookie-bite"></i> Cookie Preferences
                </button>
              </div>
            </div>

            <!-- Rate Us Feedback -->
            <div class="tb-panel">
              <div class="tb-panel-head">
                <div class="tb-panel-title">
                  <h3>Rate Your Experience</h3>
                  <p>Help us improve TravelBuddy.</p>
                </div>
              </div>

              <form id="feedbackForm" class="stack-form">
                <div class="field">
                  <label for="feedbackRatingSelect">How would you rate us?</label>
                  <select id="feedbackRatingSelect" class="tb-select">
                    <option value="5">⭐⭐⭐⭐⭐ - Excellent</option>
                    <option value="4">⭐⭐⭐⭐ - Good</option>
                    <option value="3">⭐⭐⭐ - Average</option>
                    <option value="2">⭐⭐ - Needs Work</option>
                    <option value="1">⭐ - Poor</option>
                  </select>
                </div>

                <div class="field">
                  <label for="feedbackCommentInput">Feedback or Request</label>
                  <textarea id="feedbackCommentInput" class="tb-textarea" rows="3" placeholder="Tell us what you love or what we could do better..." required></textarea>
                </div>

                <button type="submit" class="btn-primary" id="submitFeedbackBtn">
                  <span class="btn-label"><i class="fa-solid fa-paper-plane"></i> Submit Feedback</span>
                  <span class="spinner"></span>
                </button>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>


  <script defer src="../shared/config.js?v=1"></script>
  <script defer src="../shared/auth-cookie-client.js?v=1"></script>
  <script defer src="../shared/analytics-client.js?v=1"></script>
  <script defer src="../shared/validation-helper.js?v=1"></script>
  <script defer src="../shared/date-utils.js"></script>
  <script defer src="https://travelbuddy-backend-19l6.onrender.com/socket.io/socket.io.js"></script>
  <script defer src="js/common.js?v=4"></script>
  <script defer src="js/settings.js"></script>
  <script defer src="../shared/site-banner.js?v=3"></script>
</body>
</html>
