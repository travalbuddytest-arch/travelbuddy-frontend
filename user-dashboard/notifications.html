<!DOCTYPE html>
<html lang="en">
<head>
<script src="../shared/auth-guard.js" data-guard="user"></script>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>TravelBuddy — Notifications</title>
<link rel="icon" type="image/jpeg" href="../images/logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/common.css" />
<link rel="stylesheet" href="css/notifications.css" />
  <link rel="stylesheet" href="../shared/site-banner.css?v=3">
</head>
<body>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div class="app-shell">
    <div id="tbAppSidebarInclude"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main">
      <div id="tbAppTopbarInclude"></div>

      <!-- Content -->
      <main class="content" id="content">

        <section class="view active" id="view-notifications">
          <div class="panel">
            <div class="panel-head panel-head--row">
              <h2>Notifications</h2>
              <div class="tab-row" id="notifTabs">
                <button class="tab-btn active" data-filter="all">All</button>
                <button class="tab-btn" data-filter="unread">Unread</button>
              </div>
              <button class="link-btn" id="markAllReadBtn">Mark all as read</button>
            </div>
            <ul class="notif-list" id="notifList"></ul>
          </div>
        </section>

      </main>
    </div>
  </div>

    <script defer src="../shared/config.js?v=1"></script>
    <script defer src="../shared/auth-cookie-client.js?v=1"></script>
    <script defer src="../shared/analytics-client.js?v=1"></script>
    <script defer src="../shared/date-utils.js"></script>
<script defer src="https://travelbuddy-backend-19l6.onrender.com/socket.io/socket.io.js"></script>
  <script defer src="js/common.js?v=4"></script>
  <script defer src="js/notifications.js?v=2"></script>
  <script defer src="../shared/site-banner.js?v=3"></script>
  <script defer src="../shared/firebase-config.js?v=1"></script>
  <script defer src="../shared/push-client.js?v=1"></script>
</body>
</html>
