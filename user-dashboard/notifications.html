<!DOCTYPE html>
<html lang="en">
<head>
<script src="../shared/auth-guard.js" data-guard="user"></script>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Travel Buddy — Notifications</title>
<link rel="icon" type="image/jpeg" href="../images/logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/common.css" />
<link rel="stylesheet" href="css/notifications.css" />
  <link rel="stylesheet" href="../shared/site-banner.css?v=3">
</head>
<body>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div class="app-shell">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <a href="../home/index.html" class="brand">
          <img src="../images/logo.jpeg" alt="" width="32" height="32" />
          <img src="../images/name.png" alt="Travel Buddy" class="brand-word" />
        </a>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <nav class="nav-list" id="navList">
        <a href="overview.html" class="nav-item" data-section="overview">
          <i class="fa-solid fa-gauge"></i><span>Overview</span>
        </a>
        <a href="post.html" class="nav-item" data-section="post">
          <i class="fa-solid fa-box"></i><span>Post a Parcel</span>
        </a>
        <a href="pickup.html" class="nav-item" data-section="pickup">
          <i class="fa-solid fa-route"></i><span>Pick Up a Parcel</span>
        </a>
        <a href="track.html" class="nav-item" data-section="track">
          <i class="fa-solid fa-location-dot"></i><span>Track Parcel</span>
        </a>
        <a href="messages.html" class="nav-item" data-section="messages">
          <i class="fa-solid fa-message"></i><span>Messages</span>
          <span class="nav-badge" id="navMsgBadge">3</span>
        </a>
        <a href="notifications.html" class="nav-item active" data-section="notifications">
          <i class="fa-solid fa-bell"></i><span>Notifications</span>
          <span class="nav-badge" id="navNotifBadge">4</span>
        </a>
        <a href="payments.html" class="nav-item" data-section="payments">
          <i class="fa-solid fa-wallet"></i><span>Payments</span>
        </a>
        <a href="history.html" class="nav-item" data-section="history">
          <i class="fa-solid fa-clock-rotate-left"></i><span>History</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item" id="logoutBtn">
          <i class="fa-solid fa-arrow-right-from-bracket"></i><span>Log out</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ================= MAIN ================= -->
    <div class="main">

      <!-- Topbar -->
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">
          <i class="fa-solid fa-bars"></i>
        </button>

        <h1 class="page-title" id="pageTitle">Notifications</h1>

        <div class="topbar-actions">
          <div class="search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Enter Order ID, e.g. TB-20260709-A7K2P" id="globalSearch" />
          </div>

          <a class="icon-btn" id="bellBtn" href="notifications.html" aria-label="Notifications">
            <i class="fa-solid fa-bell"></i>
            <span class="dot" id="bellDot"></span>
          </a>

          <div class="user-chip" id="userChip">
            <div class="avatar">BS</div>
            <div class="user-meta">
              <span class="user-name">Bhushan</span>
              <span class="user-role">Sender &amp; Traveler</span>
            </div>
            <i class="fa-solid fa-chevron-down"></i>

            <div class="user-menu" id="userMenu">
              <a href="#"><i class="fa-solid fa-user"></i> My Profile</a>
              <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
              <a href="../login/login.html"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log out</a>
            </div>
          </div>
        </div>
      </header>

      <!-- Content -->
      <main class="content" id="content">

        <section class="view active" id="view-notifications">
          <div class="panel">
            <div class="panel-head panel-head--row">
              <h2>Notifications</h2>
              <div class="tab-row" id="notifTabs">
                <button class="tab-btn active" data-filter="all">All</button>
                <button class="tab-btn" data-filter="unread">Unread</button>
              </div>
              <button class="link-btn" id="markAllReadBtn">Mark all as read</button>
            </div>
            <ul class="notif-list" id="notifList"></ul>
          </div>
        </section>

      </main>
    </div>
  </div>

    <script defer src="../shared/config.js?v=1"></script>
    <script defer src="../shared/auth-cookie-client.js?v=1"></script>
    <script defer src="../shared/analytics-client.js?v=1"></script>
<script defer src="https://travelbuddy-backend-19l6.onrender.com/socket.io/socket.io.js"></script>
  <script defer src="js/common.js?v=3"></script>
  <script defer src="js/notifications.js"></script>
  <script defer src="../shared/site-banner.js?v=3"></script>
  <script defer src="../shared/firebase-config.js?v=1"></script>
  <script defer src="../shared/push-client.js?v=1"></script>
</body>
</html>
