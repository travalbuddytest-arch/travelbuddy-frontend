<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../shared/auth-guard.js" data-guard="user"></script>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Global Search - TravelBuddy</title>
    <link rel="icon" type="image/jpeg" href="../images/logo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="../shared/site-banner.css?v=3">
    <style>
        .search-inner-container { max-width: 800px; margin: 0 auto; }
        .search-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .search-bar-wrap { flex: 1; position: relative; }
        .search-bar-wrap i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }
        .search-bar-wrap input { width: 100%; height: 48px; padding: 0 12px 0 45px; border: 1.5px solid var(--border); border-radius: 12px; outline: none; font-size: 16px; font-family: var(--font); background: var(--bg); transition: all 0.2s; }
        .search-bar-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1); background: var(--surface); }

        .recent-section { margin-top: 30px; }
        .recent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .recent-header h3 { font-size: 16px; font-weight: 700; margin: 0; }
        .recent-list { display: flex; flex-direction: column; gap: 8px; }
        .recent-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; transition: all 0.2s; }
        .recent-item:hover { transform: translateY(-1px); border-color: var(--primary); box-shadow: var(--shadow-card); }
        .recent-item i { color: var(--text-faint); }
        .recent-item span { flex: 1; color: var(--text-main); font-weight: 500; }
        .recent-item button { background: none; border: none; color: var(--text-faint); cursor: pointer; padding: 5px; font-size: 14px; }
        .recent-item button:hover { color: var(--error); }

        .results-section { margin-top: 30px; }
        .result-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; gap: 4px; }
        .result-card:hover { transform: translateY(-2px); border-color: var(--primary); box-shadow: var(--shadow-hover); }
        .result-type { font-size: 10px; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; }
        .result-title { font-weight: 700; font-size: 15px; color: var(--text-main); }
        .result-subtitle { color: var(--text-muted); font-size: 12.5px; }

        .pop-chip { background: var(--surface); border: 1.5px solid var(--border); padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--text-main); cursor: pointer; transition: all 0.2s; }
        .pop-chip:hover { border-color: var(--primary); color: var(--primary); background: rgba(13,110,253,0.05); }

        @media (max-width: 480px) {
            .search-header { flex-direction: column; align-items: stretch; }
            .back-btn { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div class="app-shell">
        <div id="tbAppSidebarInclude"></div>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <div class="main">
            <div id="tbAppTopbarInclude"></div>

            <main class="content" id="content">
                <div class="dashboard-container">
                    <div class="search-inner-container">
                        <div class="search-header">
                            <a href="overview.html" class="icon-btn back-btn"><i class="fa-solid fa-arrow-left"></i></a>
                            <div class="search-bar-wrap">
                                <i class="fa-solid fa-magnifying-glass"></i>
                                <input type="text" id="searchInput" placeholder="Search city, route or parcel..." autocomplete="off">
                            </div>
                        </div>

                        <div id="initialContent">
                            <div class="recent-section" id="recentSearchesSection" style="display: none;">
                                <div class="recent-header">
                                    <h3>Recent Searches</h3>
                                    <button id="clearAllBtn" style="color: var(--primary); background: none; border: none; cursor: pointer; font-weight: 600; font-size: 13px;">Clear All</button>
                                </div>
                                <div class="recent-list" id="recentList">
                                    <!-- Recent searches here -->
                                </div>
                            </div>

                            <div class="popular-section" style="margin-top: 30px;">
                                <h3 style="font-size: 16px; font-weight: 700; margin: 0 0 15px;">Popular Cities</h3>
                                <div class="popular-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px;">
                                    <button type="button" class="pop-chip">Mumbai</button>
                                    <button type="button" class="pop-chip">Pune</button>
                                    <button type="button" class="pop-chip">Delhi</button>
                                    <button type="button" class="pop-chip">Bangalore</button>
                                </div>
                            </div>
                        </div>

                        <div id="resultsContent" style="display: none;">
                            <div class="results-section" id="resultsList">
                                <!-- Search results here -->
                            </div>
                        </div>

                        <div id="loadingState" style="display: none; text-align: center; margin-top: 50px;">
                            <i class="fa-solid fa-spinner fa-spin" style="font-size: 30px; color: var(--primary);"></i>
                            <p style="margin-top: 10px; color: var(--text-muted); font-size: 13.5px;">Searching platform...</p>
                        </div>

                        <div id="emptyState" style="display: none; text-align: center; margin-top: 50px;">
                            <i class="fa-solid fa-search" style="font-size: 40px; color: var(--text-faint); margin-bottom: 14px; display: block;"></i>
                            <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 6px;">No results found</h3>
                            <p style="color: var(--text-muted); font-size: 13.5px;">Try searching for a different city or parcel ID.</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="../shared/config.js"></script>
    <script src="../shared/auth-cookie-client.js"></script>
    <script src="js/common.js?v=4"></script>
    <script src="js/search.js"></script>
</body>
</html>
