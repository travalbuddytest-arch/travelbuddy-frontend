<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../shared/auth-guard.js" data-guard="user"></script>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TravelBuddy — My Profile</title>
  <link rel="icon" type="image/jpeg" href="../images/logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="../shared/site-banner.css?v=3">
  <style>
    .profile-hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 30px;
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .profile-avatar-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 50%;
    }
    .profile-large-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 32px;
      font-weight: 800;
      background-size: cover;
      background-position: center;
    }
    .avatar-edit-badge {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      border: 2.5px solid var(--surface);
      font-size: 13px;
      transition: transform 0.18s ease;
    }
    .avatar-edit-badge:hover {
      transform: scale(1.1);
    }
    .profile-meta-head {
      flex: 1;
      min-width: 220px;
    }
    .profile-meta-head h2 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div class="app-shell">
    <div id="tbAppSidebarInclude"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main">
      <div id="tbAppTopbarInclude"></div>

      <main class="content" id="content">
        <!-- Hero Card -->
        <div class="profile-hero-card">
          <div class="profile-avatar-wrap">
            <div class="profile-large-avatar" id="heroAvatar">TB</div>
            <label class="avatar-edit-badge" for="photoFileInput" title="Upload new photo">
              <i class="fa-solid fa-camera"></i>
            </label>
            <input type="file" id="photoFileInput" accept="image/jpeg, image/png" style="display:none;" />
          </div>

          <div class="profile-meta-head">
            <h2>
              <span id="heroFullName">User Name</span>
              <i class="fa-solid fa-circle-check" id="heroVerifiedBadge" style="color:var(--primary); font-size:18px;" title="Verified Profile"></i>
            </h2>
            <p style="margin:0 0 8px; font-size:13.5px; color:var(--text-muted);" id="heroEmail">user@example.com</p>
            <div style="display:flex; gap:14px; font-size:12.5px; color:var(--text-faint); flex-wrap:wrap;">
              <span><i class="fa-solid fa-star" style="color:#F59E0B;"></i> <strong id="heroRating" style="color:var(--text-main);">0.0</strong> (<span id="heroRatingCount">0</span> reviews)</span>
              <span><i class="fa-regular fa-calendar"></i> Member since <span id="heroMemberSince">2026</span></span>
            </div>
          </div>

          <button type="button" class="btn-ghost" id="removePhotoBtn" style="font-size:12px; display:none;">
            <i class="fa-solid fa-trash"></i> Remove Photo
          </button>
        </div>

        <!-- Metric Grid -->
        <div class="metric-grid" style="margin-bottom:24px;">
          <div class="metric-box metric-box--primary">
            <span class="metric-label">Parcels Posted</span>
            <div class="metric-value" id="statsPostedCount">0</div>
            <span class="metric-sub">Posted as sender</span>
          </div>
          <div class="metric-box metric-box--success">
            <span class="metric-label">Parcels Delivered</span>
            <div class="metric-value" id="statsDeliveredCount">0</div>
            <span class="metric-sub">Transported as traveler</span>
          </div>
          <div class="metric-box">
            <span class="metric-label">Wallet Balance</span>
            <div class="metric-value" id="statsWalletBalance">₹0.00</div>
            <span class="metric-sub">Available &amp; held funds</span>
          </div>
        </div>

        <!-- Edit Profile Form -->
        <div class="panel" style="max-width:700px;">
          <div class="panel-head">
            <h2>Personal Information</h2>
            <p class="panel-sub">Update your account profile details.</p>
          </div>

          <form id="editProfileForm" class="stack-form">
            <div class="form-row">
              <div class="field">
                <label for="inputFirstName">First Name *</label>
                <input type="text" id="inputFirstName" placeholder="First Name" required />
              </div>
              <div class="field">
                <label for="inputLastName">Last Name *</label>
                <input type="text" id="inputLastName" placeholder="Last Name" required />
              </div>
            </div>

            <div class="field">
              <label for="inputEmail">Email Address (Read-only)</label>
              <input type="email" id="inputEmail" readonly style="background:#F8FAFC; color:var(--text-muted); cursor:not-allowed;" />
            </div>

            <div class="field">
              <label for="inputPhone">Mobile Number (with country code)</label>
              <input type="tel" id="inputPhone" placeholder="+919876543210" />
            </div>

            <button type="submit" class="btn-primary" id="saveProfileBtn" style="align-self:flex-start; margin-top:8px;">
              <span class="btn-label"><i class="fa-solid fa-check"></i> Save Profile Changes</span>
              <span class="spinner"></span>
            </button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script defer src="../shared/config.js?v=1"></script>
  <script defer src="../shared/auth-cookie-client.js?v=1"></script>
  <script defer src="../shared/analytics-client.js?v=1"></script>
  <script defer src="../shared/date-utils.js"></script>
  <script defer src="https://travelbuddy-backend-19l6.onrender.com/socket.io/socket.io.js"></script>
  <script defer src="js/common.js?v=4"></script>
  <script defer src="js/profile.js"></script>
  <script defer src="../shared/site-banner.js?v=3"></script>
</body>
</html>
