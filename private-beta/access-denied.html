<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Beta Access Restricted — CarryParcel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .icon-container {
      width: 80px;
      height: 80px;
      background: rgba(37, 99, 235, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: var(--accent);
      font-size: 36px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
    }
    .btn-primary {
      background-color: var(--accent);
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: var(--accent-hover);
    }
    .btn-secondary {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <i class="fa-solid fa-user-lock"></i>
    </div>
    <h1>Private Beta Access Restricted</h1>
    <p>CarryParcel is currently operating in private beta. Access to protected services is restricted to approved testing accounts. Please log in with an authorized account to continue testing.</p>
    <div class="btn-group">
      <button class="btn btn-primary" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i> Sign In with Another Account
      </button>
      <a href="../index.html" class="btn btn-secondary">
        <i class="fa-solid fa-house"></i> Return to Homepage
      </a>
    </div>
  </div>

  <script src="../shared/auth-cookie-client.js"></script>
  <script>
    document.getElementById('logoutBtn').addEventListener('click', async function() {
      if (window.CarryParcelAuth && typeof window.CarryParcelAuth.logout === 'function') {
        await window.CarryParcelAuth.logout();
      } else {
        localStorage.clear();
      }
      window.location.href = '../login/login.html';
    });
  </script>
</body>
</html>
