<link rel="stylesheet" href="../css/analytics.css">

  <div class="analytics-grid">
    <article class="panel">
      <h3>User Growth (30 days)</h3>
      <div class="bar-chart" id="userGrowthChart"></div>
    </article>
    <article class="panel">
      <h3>Parcel Volume (30 days)</h3>
      <div class="bar-chart" id="parcelVolumeChart"></div>

  <div class="analytics-grid">
    <article class="panel">
      <h3>Status Distribution</h3>

    <article class="panel">
      <h3>Top Routes</h3>
      <div id="topRoutes" class="route-list"></div>
