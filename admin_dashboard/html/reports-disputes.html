<div class="reports-disputes-container">
    <div class="header-row">
        <h3><i class="fa-solid fa-scale-balanced"></i> Reports & Disputes</h3>
        <button class="btn secondary sm" id="refreshDisputes"><i class="fa-solid fa-arrows-rotate"></i> Refresh</button>
    </div>

    <div class="filters">
        <select id="disputeStatusFilter">
            <option value="open">Open Disputes</option>
            <option value="under_review">Under Review</option>
            <option value="resolved">Resolved</option>
            <option value="all">All Cases</option>
        </select>
        <select id="disputeTypeFilter">
            <option value="all">All Types</option>
            <option value="parcel">Parcel Related</option>
            <option value="user">User Conduct</option>
            <option value="trip">Trip Related</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Reported</th>
                    <th>Reporter</th>
                    <th>Type</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="disputes-list">
                <!-- Data loads here -->
            </tbody>
        </table>
    </div>

    <div class="pagination" id="disputePagination"></div>
</div>

<!-- Report Resolution Modal -->
<div class="modal" id="reportResolveModal">
    <div class="admin-profile-box" style="width: 500px;">
        <button class="admin-profile-close" id="reportResolveClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        <h3>Resolve Report / Dispute</h3>
        <div id="reportResolveBody" style="margin: 15px 0;"></div>
        <form id="reportResolveForm">
            <div style="margin-bottom: 12px;">
                <label style="font-size: 11px; font-weight: 600; display: block; margin-bottom: 4px;">Update Status</label>
                <select id="reportResolveStatus" class="pc-select" style="width: 100%;">
                    <option value="under_review">Under Review</option>
                    <option value="resolved">Resolved</option>
                    <option value="dismissed">Dismissed</option>
                </select>
            </div>
            <div style="margin-bottom: 16px;">
                <label style="font-size: 11px; font-weight: 600; display: block; margin-bottom: 4px;">Admin Notes</label>
                <textarea id="reportResolveNotes" class="pc-filter-input" style="width: 100%; height: 80px; padding: 8px;" placeholder="Reason or resolution details..."></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button type="button" class="btn secondary sm" id="reportResolveCancel">Cancel</button>
                <button type="submit" class="btn primary sm" id="reportResolveSubmit">Save Resolution</button>
            </div>
        </form>
    </div>
</div>

<link rel="stylesheet" href="../css/support-reports.css">
<script type="module" src="../js/reports-disputes.js"></script>
