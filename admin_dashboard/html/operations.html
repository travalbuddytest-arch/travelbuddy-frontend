<link rel="stylesheet" href="../css/live-operations.css">

<section class="ops-container">
    <!-- Top KPI Section -->
    <div class="ops-kpi-grid">
        <div class="ops-kpi-card active">
            <span>Active Parcels</span>
            <strong id="kpiActive">0</strong>
        </div>
        <div class="ops-kpi-card">
            <span>In Transit</span>
            <strong id="kpiTransit">0</strong>
        </div>
        <div class="ops-kpi-card">
            <span>Traveler Assigned</span>
            <strong id="kpiAssigned">0</strong>
        </div>
        <div class="ops-kpi-card">
            <span>Picked Up</span>
            <strong id="kpiPickedUp">0</strong>
        </div>
        <div class="ops-kpi-card">
            <span>Near Destination</span>
            <strong id="kpiNear">0</strong>
        </div>
        <div class="ops-kpi-card urgent">
            <span>Needs Attention</span>
            <strong id="kpiUrgent">0</strong>
        </div>
    </div>

    <!-- Professional Filter Toolbar -->
    <div class="ops-filter-bar">
        <div class="ops-filter-group">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="opsSearch" placeholder="Search Parcel ID, Name, City...">
        </div>
        <div class="ops-filter-group">
            <i class="fa-solid fa-filter"></i>
            <select id="opsStatusFilter">
                <option value="all">All Active States</option>
                <option value="pending">Awaiting Traveler</option>
                <option value="accepted">Traveler Assigned</option>
                <option value="pickup_confirmed">Picked Up</option>
                <option value="in_transit">In Transit</option>
                <option value="disputed">Attention Required</option>
            </select>
        </div>
        <div class="ops-filter-group">
            <i class="fa-solid fa-clock"></i>
            <select id="opsTimeFilter">
                <option value="all">Any Time</option>
                <option value="1h">Last 1 Hour</option>
                <option value="6h">Last 6 Hours</option>
                <option value="24h">Today</option>
            </select>
        </div>
        <button class="ops-btn" id="opsResetFilters">Reset</button>

        <div class="ops-live-status">
            <span class="ops-dot live" id="opsLiveDot"></span>
            <span id="opsLiveText">LIVE</span>
            <span id="opsLastUpdate" style="color: #64748b; font-size: 11px; margin-left: 8px;">Just now</span>
        </div>
    </div>

    <!-- Main Operational Layout -->
    <div class="ops-main-layout">
        <!-- India Map View -->
        <div class="ops-map-wrapper">
            <div id="opsLeafletMap"></div>

            <!-- Floating Parcel Details (Map Overlay) -->
            <div class="ops-detail-panel" id="opsDetailPanel">
                <button class="ops-detail-close" id="opsDetailClose"><i class="fa-solid fa-xmark"></i></button>
                <div class="ops-detail-head">
                    <h2 id="detOrderId">TB-XXXXX</h2>
                    <span id="detStatus">● In Transit</span>
                </div>

                <div class="ops-detail-section">
                    <label>Route</label>
                    <div id="detRoute">Source → Destination</div>
                </div>

                <div class="ops-detail-section">
                    <label>Traveler</label>
                    <div id="detTraveler">Rahul K.</div>
                </div>

                <div class="ops-detail-section">
                    <label>Current Location</label>
                    <div id="detLocation">Near Surat, Gujarat</div>
                </div>

                <div class="ops-detail-section">
                    <label>Last Updated</label>
                    <div id="detLastSeen">8 seconds ago</div>
                </div>

                <div class="ops-detail-actions">
                    <button class="ops-btn primary" id="detViewBtn">View Parcel</button>
                    <button class="ops-btn" id="detChatBtn">Open Chat</button>
                </div>
            </div>
        </div>

        <!-- Sidebar Parcel List -->
        <div class="ops-list-panel">
            <div class="ops-list-header">
                <span>Active Journeys</span>
                <span id="opsListCount" style="color: #64748b;">0</span>
            </div>
            <div class="ops-parcel-list" id="opsList">
                <!-- Items injected via JS -->
            </div>
        </div>
    </div>

    <script type="module" src="../js/operations.js"></script>
</section>
