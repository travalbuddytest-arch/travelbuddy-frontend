<div class="support-reports-container">
    <div class="tabs">
        <button class="tab-btn active" data-tab="reports">User Reports</button>
        <button class="tab-btn" data-tab="tickets">Support Tickets</button>
    </div>

    <div class="tab-content active" id="reports-tab">
        <div class="filters">
            <select id="report-status-filter">
                <option value="all">All Status</option>
                <option value="open">Open</option>
                <option value="under_review">Under Review</option>
                <option value="resolved">Resolved</option>
                <option value="dismissed">Dismissed</option>
            </select>
            <select id="report-type-filter">
                <option value="all">All Types</option>
                <option value="parcel">Parcel</option>
                <option value="user">User</option>
                <option value="trip">Trip</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>From User</th>
                        <th>Type</th>
                        <th>Target</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="reports-list">
                    <!-- Reports will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="tab-content" id="tickets-tab">
        <div class="filters">
            <select id="ticket-status-filter">
                <option value="all">All Status</option>
                <option value="open">Open</option>
                <option value="in_progress">In Progress</option>
                <option value="resolved">Resolved</option>
                <option value="closed">Closed</option>
            </select>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>User</th>
                        <th>Category</th>
                        <th>Subject</th>
                        <th>Status</th>
                        <th>Priority</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tickets-list">
                    <!-- Tickets will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Chat Modal -->
<div class="modal" id="chat-modal">
    <div class="chat-container">
        <div class="chat-header">
            <h3 id="chat-title">Support Chat</h3>
            <button id="close-chat">×</button>
        </div>
        <div class="chat-messages" id="chat-messages">
            <!-- Messages load here -->
        </div>
        <div class="chat-input">
            <input type="text" id="chat-input-field" placeholder="Type a message...">
            <button id="send-chat-btn">Send</button>
        </div>
    </div>
</div>

<link rel="stylesheet" href="../css/support-reports.css">
<script src="../js/support-reports.js"></script>
